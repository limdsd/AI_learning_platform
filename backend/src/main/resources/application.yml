spring:
  application:
    name: demo
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DB:learning_platform}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:}
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: assign_id
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

server:
  port: 8081

# DeepSeek 大模型配置
# api-key 从环境变量 DEEPSEEK_API_KEY 读取(切勿提交真实密钥到仓库)
# 本地开发:在 IDEA 的 Run Configuration 里加环境变量,或命令行 export/set DEEPSEEK_API_KEY=你的key
deepseek:
  api-key: ${DEEPSEEK_API_KEY:}
  base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
  model: ${DEEPSEEK_MODEL:deepseek-v4-pro}

# Embedding 向量化配置(用于相似题语义检索 RAG)
# api-key 从环境变量 EMBEDDING_API_KEY 读取;base-url 默认硅基流动(免费 bge-m3)
embedding:
  api-key: ${EMBEDDING_API_KEY:}
  base-url: ${EMBEDDING_BASE_URL:https://api.siliconflow.cn/v1}
  model: ${EMBEDDING_MODEL:BAAI/bge-m3}

# JWT 配置
# 密钥从环境变量 JWT_SECRET 读取;本地开发可在 application-local.yml(已 gitignore)里配置
jwt:
  secret: ${JWT_SECRET:}
  expiration: 86400000  # 24 小时(毫秒)
